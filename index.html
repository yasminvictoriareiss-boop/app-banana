<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Candidatura</title>
    <!-- Vincula o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Verificação de Elegibilidade para Vaga</h2>
        
        <form id="formCandidato">
            <div class="input-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" required placeholder="Digite seu nome">
            </div>

            <div class="input-group">
                <label for="idade">Idade (anos):</label>
                <input type="number" id="idade" min="0" required placeholder="Ex: 20">
            </div>

            <div class="input-group">
                <label for="altura">Altura (metros):</label>
                <input type="number" id="altura" step="0.01" min="0" required placeholder="Ex: 1.75">
            </div>

            <button type="button" onclick="verificarElegibilidade()">Verificar</button>
        </form>

        <!-- Local onde a mensagem de resultado será exibida -->
        <div id="resultado" class="resultado"></div>
    </div>

    <!-- Vincula o arquivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
